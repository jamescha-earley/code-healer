name: 'Code Healer'
description: 'Fix bugs from GitHub issues using the Snowflake Managed Agents API (code_toolset_all)'
author: 'jamescha-earley'

inputs:
  issue-number:
    description: 'GitHub issue number to fix'
    required: true
  snowflake-connection:
    description: 'Snowflake connection name'
    required: false
    default: 'default'
  snowflake-config:
    description: 'Contents of connections.toml (store as a GitHub secret)'
    required: false
    default: ''
  workspace:
    description: 'Workspace FQN to mount (default: auto-detect from user)'
    required: false
    default: ''
  dry-run:
    description: 'Fix code but skip PR creation'
    required: false
    default: 'false'

outputs:
  pr-url:
    description: 'URL of the created pull request'
    value: ${{ steps.heal.outputs.pr-url }}
  status:
    description: 'Outcome: success, no-changes, or failed'
    value: ${{ steps.heal.outputs.status }}
  confidence:
    description: 'Agent confidence: high, medium, or low'
    value: ${{ steps.heal.outputs.confidence }}

runs:
  using: 'composite'
  steps:
    - name: Configure Snowflake auth
      if: inputs.snowflake-config != ''
      shell: bash
      env:
        SNOWFLAKE_CONFIG_CONTENT: ${{ inputs.snowflake-config }}
      run: |
        mkdir -p ~/.snowflake
        printf '%s\n' "$SNOWFLAKE_CONFIG_CONTENT" > ~/.snowflake/connections.toml
        chmod 600 ~/.snowflake/connections.toml

    - name: Install Python dependencies
      shell: bash
      run: pip install snowflake-connector-python requests

    - name: Run Code Healer
      id: heal
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ISSUE_URL: ${{ github.server_url }}/${{ github.repository }}/issues/${{ inputs.issue-number }}
      run: |
        cd ${{ github.action_path }}

        ARGS="--issue $ISSUE_URL --ci"
        if [ -n "${{ inputs.snowflake-connection }}" ]; then
          ARGS="$ARGS --connection ${{ inputs.snowflake-connection }}"
        fi
        if [ -n "${{ inputs.workspace }}" ]; then
          ARGS="$ARGS --workspace ${{ inputs.workspace }}"
        fi
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          ARGS="$ARGS --dry-run"
        fi

        python heal.py $ARGS

    - name: Comment on issue
      if: always()
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        STATUS="${{ steps.heal.outputs.status }}"
        PR_URL="${{ steps.heal.outputs.pr-url }}"
        ISSUE="${{ inputs.issue-number }}"
        REPO="${{ github.repository }}"
        CONFIDENCE="${{ steps.heal.outputs.confidence }}"

        if [ "$STATUS" = "success" ]; then
          BODY="**Code Healer** created a fix: ${PR_URL}\n\nConfidence: **${CONFIDENCE}**"
        else
          BODY="**Code Healer** could not fix this issue automatically.\n\nCheck the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
        fi

        gh issue comment "$ISSUE" --repo "$REPO" --body "$(echo -e "$BODY")"
        gh issue edit "$ISSUE" --repo "$REPO" --remove-label "heal" || true
